services:
  postgres:
    image: postgres:16-alpine
    container_name: afterservice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:?DATABASE_URL must include a database name}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DATABASE_URL must include a password}"
      POSTGRES_USER: "${DB_USER:?DATABASE_URL must include a user}"
    ports:
      - "${DB_HOST_PORT:?DATABASE_URL must include a local PostgreSQL port}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - afterservice-postgres-data:/var/lib/postgresql/data

volumes:
  afterservice-postgres-data:
